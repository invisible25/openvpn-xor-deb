# Источники сборки. Меняется только через update-sources.sh.
#
# Исходники берутся из официальных релизов OpenVPN на GitHub: там лежат подписанные
# тарболы всех веток, и старые релизы не удаляются. Tunnelblick в main держит только
# последнюю версию каждой ветки и удаляет предыдущие — именно поэтому прежний
# fetch-sources.sh с жёстко заданными 2.5.9/2.6.20/2.7.4 начал получать 404.
#
# XOR-патчи лежат в build/patches/<версия>/ прямо в репозитории (это ~10 КБ на
# версию), а здесь записано, из какого коммита Tunnelblick они взяты.

# Ключ, которым OpenVPN подписывает релизы: «OpenVPN - Security Mailing List
# <security@openvpn.net>». Закреплён отпечаток ОСНОВНОГО ключа: подписывают его
# подключи, а они ротируются (действующий создан в июле 2026), и закреплённый
# подключ сломал бы проверку при первой же ротации.
# Основной ключ действует до 2027-02-07 — после этого обновить его через
# update-sources.sh, иначе проверка подписей начнёт падать.
OPENVPN_SIGNING_KEY="F554A3687412CFFEBDEFE0A312F5F7B42F2B01E7"

# Версии по веткам. 2.5 — последний подписанный релиз ветки: в Tunnelblick она
# сейчас лежит как git-снапшот 2.5_git_37160ee без подписи, и, кроме того, '_'
# недопустим в версии deb-пакета.
OVPNS="2.5.11 2.6.23 2.7.7"

# SHA-256 официальных тарболов. Проверяются ДО распаковки, подпись — после.
SHA256_2_5_11="7e2672119bd4639819d560f332a8b9b7e28f562425c77899f36d419fe4265f56"
SHA256_2_6_23="4041c709162bec1325abf5aa8cf27a255cc477c634b15ee310411c701fc40a96"
SHA256_2_7_7="3ab8f48fd6c26d49ba2333a092433949afdb5c85c0e6a1ff265784fbc04a2463"

# Откуда взяты патчи (Tunnelblick/Tunnelblick, third_party/sources/openvpn).
PATCHES_FROM_2_5_11="51ec272ba4945cea8c506643e662806151c6cfb3"
PATCHES_FROM_2_6_23="8cfd9b89144824176c3f28fd921e54156fe141a3"
PATCHES_FROM_2_7_7="8cfd9b89144824176c3f28fd921e54156fe141a3"
